<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribers — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0f0b08;color:#f2e8d8;font-family:'Manrope',sans-serif;padding:6vw;max-width:900px;margin:0 auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .topbar a{color:#b08d57;text-decoration:none;font-size:13px;}
  h1{margin:20px 0 6px;}
  .subcount{color:#8a7c68;font-size:13px;margin-bottom:24px;}
  .btn{background:transparent;border:1px solid rgba(242,232,216,.3);color:#f2e8d8;padding:10px 18px;border-radius:6px;cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;}
  .btn:hover{border-color:#b08d57;color:#b08d57;}
  .btn-primary{background:#f2e8d8;color:#0f0b08;border:none;}
  .btn-primary:hover{background:#b08d57;color:#0f0b08;}
  .btn-danger{border-color:#e05c4a;color:#e05c4a;font-size:11px;padding:6px 10px;}
  .btn-danger:hover{background:#e05c4a;color:#0f0b08;}

  .toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .toolbar input{flex:1;min-width:200px;background:transparent;border:1px solid rgba(242,232,216,.25);border-radius:6px;padding:11px 14px;color:#f2e8d8;font-size:14px;font-family:inherit;}
  .toolbar input:focus{outline:none;border-color:#b08d57;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a7c68;padding:10px 8px;border-bottom:1px solid rgba(242,232,216,.15);white-space:nowrap;}
  td{padding:12px 8px;border-bottom:1px solid rgba(242,232,216,.08);vertical-align:top;}
  td.actions{white-space:nowrap;}
  .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(242,232,216,.08);color:#8a7c68;margin-right:4px;}
  .tag.on{background:rgba(212,164,100,.15);color:#b08d57;}
  .empty-msg{color:#8a7c68;padding:30px 0;text-align:center;}
  .table-wrap{overflow-x:auto;}
</style>
</head>
<body>

  <div class="topbar">
    <a href="dashboard.html">← Dashboard</a>
    <button class="btn" onclick="adminLogout()">Log Out</button>
  </div>

  <h1>Subscribers</h1>
  <p class="subcount" id="subCount">Loading...</p>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="Search by name, email, or country...">
    <button class="btn btn-primary" id="exportBtn">Export CSV</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Email</th><th>WhatsApp</th><th>Country</th><th>Opt-ins</th><th>Joined</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="subList"></tbody>
    </table>
  </div>
  <p class="empty-msg" id="emptyMsg" style="display:none;">No subscribers yet.</p>

<script>
  let allSubs = [];

  (async () => {
    await requireAdminAuth();
    loadSubscribers();
  })();

  async function loadSubscribers() {
    const { data, error } = await adminClient
      .from('subscribers')
      .select('*')
      .order('created_at', { ascending: false });
    allSubs = (!error && data) ? data : [];
    document.getElementById('subCount').textContent = `${allSubs.length} total subscriber${allSubs.length === 1 ? '' : 's'}`;
    renderList(allSubs);
  }

  function renderList(subs) {
    const list = document.getElementById('subList');
    const emptyMsg = document.getElementById('emptyMsg');
    list.innerHTML = '';
    if (subs.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    subs.forEach(s => {
      const row = document.createElement('tr');
      const joined = s.created_at ? new Date(s.created_at).toLocaleDateString() : '';
      row.innerHTML = `
        <td>${s.first_name || '—'}</td>
        <td>${s.email || '—'}</td>
        <td>${s.whatsapp || '—'}</td>
        <td>${s.country || '—'}</td>
        <td>
          <span class="tag ${s.email_opt_in ? 'on' : ''}">Email</span>
          <span class="tag ${s.whatsapp_opt_in ? 'on' : ''}">WhatsApp</span>
        </td>
        <td>${joined}</td>
        <td class="actions"><button class="btn btn-danger" onclick="deleteSub('${s.id}')">Delete</button></td>
      `;
      list.appendChild(row);
    });
  }

  document.getElementById('searchBox').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = allSubs.filter(s =>
      (s.first_name || '').toLowerCase().includes(q) ||
      (s.email || '').toLowerCase().includes(q) ||
      (s.country || '').toLowerCase().includes(q)
    );
    renderList(filtered);
  });

  async function deleteSub(id) {
    if (!confirm('Remove this subscriber?')) return;
    await adminClient.from('subscribers').delete().eq('id', id);
    loadSubscribers();
  }

  document.getElementById('exportBtn').addEventListener('click', () => {
    if (allSubs.length === 0) return;
    const headers = ['first_name', 'email', 'whatsapp', 'country', 'email_opt_in', 'whatsapp_opt_in', 'created_at'];
    const rows = allSubs.map(s => headers.map(h => `"${(s[h] ?? '').toString().replace(/"/g, '""')}"`).join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `oteezygmb-subscribers-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
