<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour Dates — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0f0b08;color:#f2e8d8;font-family:'Manrope',sans-serif;padding:6vw;max-width:800px;margin:0 auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .topbar a{color:#b08d57;text-decoration:none;font-size:13px;}
  h1{margin:20px 0 26px;}
  .btn{background:transparent;border:1px solid rgba(242,232,216,.3);color:#f2e8d8;padding:10px 18px;border-radius:6px;cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;}
  .btn:hover{border-color:#b08d57;color:#b08d57;}
  .btn-primary{background:#f2e8d8;color:#0f0b08;border:none;}
  .btn-primary:hover{background:#b08d57;color:#0f0b08;}
  .btn-danger{border-color:#e05c4a;color:#e05c4a;}
  .btn-danger:hover{background:#e05c4a;color:#0f0b08;}

  .form-card{border:1px solid rgba(242,232,216,.15);border-radius:10px;padding:24px;margin-bottom:30px;}
  .form-card h2{font-size:16px;margin-bottom:16px;}
  label{display:block;font-size:13px;margin-bottom:6px;color:#c9bba3;}
  input{width:100%;background:transparent;border:1px solid rgba(242,232,216,.25);border-radius:6px;padding:11px 14px;color:#f2e8d8;font-size:14px;margin-bottom:16px;font-family:inherit;}
  input:focus{outline:none;border-color:#b08d57;}
  .form-row{display:flex;gap:20px;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a7c68;padding:10px 8px;border-bottom:1px solid rgba(242,232,216,.15);}
  td{padding:12px 8px;border-bottom:1px solid rgba(242,232,216,.08);font-size:14px;vertical-align:top;}
  td.actions{white-space:nowrap;}
  td.actions button{margin-right:6px;font-size:11px;padding:6px 10px;}
  .empty-msg{color:#8a7c68;padding:20px 0;text-align:center;}
</style>
</head>
<body>

  <div class="topbar">
    <a href="dashboard.html">← Dashboard</a>
    <button class="btn" onclick="adminLogout()">Log Out</button>
  </div>

  <h1>Tour Dates</h1>

  <div class="form-card">
    <h2 id="formTitle">Add New Date</h2>
    <form id="eventForm">
      <div class="form-row">
        <div style="flex:1;">
          <label>Event Date (shown as typed, e.g. SEP 14, 2026)</label>
          <input type="text" id="eventDate" required placeholder="SEP 14, 2026">
        </div>
        <div style="flex:1;">
          <label>City / Venue</label>
          <input type="text" id="eventCity" required placeholder="Lagos, Nigeria">
        </div>
      </div>
      <label>Event Title</label>
      <input type="text" id="eventTitle" required placeholder="OTEEZY Live at The Shrine">
      <label>Ticket Link</label>
      <input type="text" id="eventLink" placeholder="https://...">
      <button type="submit" class="btn btn-primary" id="saveBtn">Add Date</button>
      <button type="button" class="btn" id="cancelEditBtn" style="display:none;margin-left:10px;">Cancel</button>
    </form>
  </div>

  <table>
    <thead>
      <tr><th>Date</th><th>Event</th><th>City</th><th>Actions</th></tr>
    </thead>
    <tbody id="eventsList"></tbody>
  </table>
  <p class="empty-msg" id="emptyMsg" style="display:none;">No tour dates yet — add your first one above.</p>

<script>
  let editingId = null;

  (async () => {
    await requireAdminAuth();
    loadEvents();
  })();

  async function loadEvents() {
    const { data, error } = await adminClient.from('tour_events').select('*').order('created_at', { ascending: true });
    const list = document.getElementById('eventsList');
    const emptyMsg = document.getElementById('emptyMsg');
    list.innerHTML = '';
    if (error || !data || data.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    data.forEach(ev => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${ev.event_date || ''}</td>
        <td>${ev.title || ''}</td>
        <td>${ev.city || ''}</td>
        <td class="actions">
          <button class="btn" onclick='editEvent(${JSON.stringify(ev)})'>Edit</button>
          <button class="btn btn-danger" onclick="deleteEvent('${ev.id}')">Delete</button>
        </td>
      `;
      list.appendChild(row);
    });
  }

  function editEvent(ev) {
    editingId = ev.id;
    document.getElementById('eventDate').value = ev.event_date || '';
    document.getElementById('eventCity').value = ev.city || '';
    document.getElementById('eventTitle').value = ev.title || '';
    document.getElementById('eventLink').value = ev.ticket_link || '';
    document.getElementById('formTitle').textContent = 'Edit Date';
    document.getElementById('saveBtn').textContent = 'Save Changes';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    editingId = null;
    document.getElementById('eventForm').reset();
    document.getElementById('formTitle').textContent = 'Add New Date';
    document.getElementById('saveBtn').textContent = 'Add Date';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }
  document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

  document.getElementById('eventForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      event_date: document.getElementById('eventDate').value,
      city: document.getElementById('eventCity').value,
      title: document.getElementById('eventTitle').value,
      ticket_link: document.getElementById('eventLink').value,
    };
    if (editingId) {
      await adminClient.from('tour_events').update(payload).eq('id', editingId);
    } else {
      await adminClient.from('tour_events').insert([payload]);
    }
    resetForm();
    loadEvents();
  });

  async function deleteEvent(id) {
    if (!confirm('Delete this tour date?')) return;
    await adminClient.from('tour_events').delete().eq('id', id);
    loadEvents();
  }
</script>

</body>
</html>
