<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Performances — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0f0b08;color:#f2e8d8;font-family:'Manrope',sans-serif;padding:6vw;max-width:800px;margin:0 auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .topbar a{color:#b08d57;text-decoration:none;font-size:13px;}
  h1{margin:20px 0 26px;}
  .btn{background:transparent;border:1px solid rgba(242,232,216,.3);color:#f2e8d8;padding:10px 18px;border-radius:6px;cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;}
  .btn:hover{border-color:#b08d57;color:#b08d57;}
  .btn-primary{background:#f2e8d8;color:#0f0b08;border:none;}
  .btn-primary:hover{background:#b08d57;color:#0f0b08;}
  .btn-danger{border-color:#e05c4a;color:#e05c4a;}
  .btn-danger:hover{background:#e05c4a;color:#0f0b08;}

  .form-card{border:1px solid rgba(242,232,216,.15);border-radius:10px;padding:24px;margin-bottom:30px;}
  .form-card h2{font-size:16px;margin-bottom:16px;}
  label{display:block;font-size:13px;margin-bottom:6px;color:#c9bba3;}
  input{width:100%;background:transparent;border:1px solid rgba(242,232,216,.25);border-radius:6px;padding:11px 14px;color:#f2e8d8;font-size:14px;margin-bottom:16px;font-family:inherit;}
  input:focus{outline:none;border-color:#b08d57;}
  .form-row{display:flex;gap:20px;}
  .hint{font-size:12px;color:#8a7c68;margin-top:-10px;margin-bottom:16px;}

  .vlist{display:flex;flex-direction:column;gap:10px;}
  .vrow{display:flex;align-items:center;gap:14px;border:1px solid rgba(242,232,216,.1);border-radius:8px;padding:10px 14px;}
  .vrow-date{width:52px;flex-shrink:0;text-align:center;font-family:'Space Mono',monospace;color:#b08d57;}
  .vrow-date .day{font-size:18px;line-height:1;}
  .vrow-date .mon{font-size:11px;letter-spacing:.08em;}
  .vrow-info{flex:1;min-width:0;}
  .vrow-info h3{font-size:14px;margin-bottom:2px;}
  .vrow-info p{font-size:12px;color:#8a7c68;}
  .vrow-actions{display:flex;gap:6px;flex-shrink:0;}
  .vrow-actions button{font-size:11px;padding:6px 10px;}
  .empty-msg{color:#8a7c68;padding:20px 0;text-align:center;}
</style>
</head>
<body>

  <div class="topbar">
    <a href="dashboard.html">← Dashboard</a>
    <button class="btn" onclick="adminLogout()">Log Out</button>
  </div>

  <h1>Live Performances</h1>

  <div class="form-card">
    <h2 id="formTitle">Add New Performance</h2>
    <form id="liveForm">
      <label>Title</label>
      <input type="text" id="leTitle" required placeholder="OTEEZY Live at The Shrine">
      <div class="form-row">
        <div style="flex:1;">
          <label>Venue / City</label>
          <input type="text" id="leVenue" placeholder="The Shrine, Lagos">
        </div>
        <div style="flex:1;">
          <label>Date</label>
          <input type="date" id="leDate">
        </div>
      </div>
      <label>Ticket / Stream Link</label>
      <input type="text" id="leLink" placeholder="https://your-ticket-or-stream-link.com">
      <label>Order Position (1 = shown first)</label>
      <input type="number" id="lePosition" placeholder="1">
      <button type="submit" class="btn btn-primary" id="saveBtn">Add Performance</button>
      <button type="button" class="btn" id="cancelEditBtn" style="display:none;margin-left:10px;">Cancel</button>
    </form>
  </div>

  <div class="vlist" id="liveList"></div>
  <p class="empty-msg" id="emptyMsg" style="display:none;">No live performances yet — add your first one above.</p>

<script>
  let editingId = null;
  const monthNames = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  (async () => {
    await requireAdminAuth();
    loadLiveEvents();
  })();

  async function loadLiveEvents() {
    const { data, error } = await adminClient
      .from('live_events')
      .select('*')
      .order('position', { ascending: true, nullsFirst: false })
      .order('created_at', { ascending: true });

    const list = document.getElementById('liveList');
    const emptyMsg = document.getElementById('emptyMsg');
    list.innerHTML = '';
    if (error || !data || data.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    data.forEach(ev => {
      const d = ev.event_date ? new Date(ev.event_date + 'T00:00:00') : null;
      const day = d ? d.getDate() : '--';
      const mon = d ? monthNames[d.getMonth()] : '';
      const row = document.createElement('div');
      row.className = 'vrow';
      row.innerHTML = `
        <div class="vrow-date"><div class="day">${day}</div><div class="mon">${mon}</div></div>
        <div class="vrow-info">
          <h3>${ev.title || ''}</h3>
          <p>${ev.venue || ''} · position ${ev.position ?? '—'}</p>
        </div>
        <div class="vrow-actions">
          <button class="btn" onclick='editLiveEvent(${JSON.stringify(ev)})'>Edit</button>
          <button class="btn btn-danger" onclick="deleteLiveEvent('${ev.id}')">Delete</button>
        </div>
      `;
      list.appendChild(row);
    });
  }

  function editLiveEvent(ev) {
    editingId = ev.id;
    document.getElementById('leTitle').value = ev.title || '';
    document.getElementById('leVenue').value = ev.venue || '';
    document.getElementById('leDate').value = ev.event_date || '';
    document.getElementById('leLink').value = ev.link || '';
    document.getElementById('lePosition').value = ev.position ?? '';
    document.getElementById('formTitle').textContent = 'Edit Performance';
    document.getElementById('saveBtn').textContent = 'Save Changes';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    editingId = null;
    document.getElementById('liveForm').reset();
    document.getElementById('formTitle').textContent = 'Add New Performance';
    document.getElementById('saveBtn').textContent = 'Add Performance';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }
  document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

  document.getElementById('liveForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const posVal = document.getElementById('lePosition').value;
    const payload = {
      title: document.getElementById('leTitle').value,
      venue: document.getElementById('leVenue').value,
      event_date: document.getElementById('leDate').value || null,
      link: document.getElementById('leLink').value,
      position: posVal ? parseInt(posVal, 10) : null,
    };
    if (editingId) {
      await adminClient.from('live_events').update(payload).eq('id', editingId);
    } else {
      await adminClient.from('live_events').insert([payload]);
    }
    resetForm();
    loadLiveEvents();
  });

  async function deleteLiveEvent(id) {
    if (!confirm('Delete this performance?')) return;
    await adminClient.from('live_events').delete().eq('id', id);
    loadLiveEvents();
  }
</script>

</body>
</html>
